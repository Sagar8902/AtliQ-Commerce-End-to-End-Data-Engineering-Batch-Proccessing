# atliq_gold/profiles.yml  (no secrets committed: only env_var() references)
atliq_gold:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: atliq
      schema: gold          # production Gold, the path Fabric reads
      threads: 4
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: atliq
      schema: ci            # a throwaway schema so CI never touches prod Gold
      threads: 4
